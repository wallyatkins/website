<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline | Wally Atkins Portal</title>
  <style>
    :root {
      --bg: #07090e;
      --card-bg: rgba(15, 23, 42, 0.7);
      --border: rgba(56, 189, 248, 0.2);
      --accent: #38bdf8;
      --text: #f0f6fc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      backdrop-filter: blur(16px);
    }
    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 1.5rem;
      border-radius: 16px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.75rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      letter-spacing: -0.02em;
    }
    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 1.75rem;
    }
    .retry-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: #07090e;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 0.85rem 1.75rem;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      width: 100%;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .retry-btn:active {
      transform: scale(0.98);
    }
    .status {
      margin-top: 1.25rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f43f5e;
    }
    .dot.online {
      background: #10b981;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>You're Currently Offline</h1>
    <p>Wally Atkins Portal is running in standalone mode. Some cloud services and live game updates will automatically reconnect once your internet connection is restored.</p>
    <button class="retry-btn" onclick="window.location.reload()">
      Retry Connection
    </button>
    <div class="status">
      <span class="dot" id="status-dot"></span>
      <span id="status-text">No network connection detected</span>
    </div>
  </div>

  <script>
    function updateOnlineStatus() {
      const dot = document.getElementById('status-dot');
      const text = document.getElementById('status-text');
      if (navigator.onLine) {
        dot.classList.add('online');
        text.textContent = 'Connection restored! Reconnecting...';
        setTimeout(() => window.location.reload(), 1200);
      } else {
        dot.classList.remove('online');
        text.textContent = 'No network connection detected';
      }
    }
    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    updateOnlineStatus();
  </script>
</body>
</html>
