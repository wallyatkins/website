name: Deploy to Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Check FTP configuration
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          test -n "$FTP_SERVER" || { echo "Missing production secret: FTP_SERVER"; exit 1; }
          test -n "$FTP_USERNAME" || { echo "Missing production secret: FTP_USERNAME"; exit 1; }
          test -n "$FTP_PASSWORD" || { echo "Missing production secret: FTP_PASSWORD"; exit 1; }

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install PHP Dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Prepare Deployment Package
        # Only vendor needs partial copy now, everything else is in dist via build script
        run: |
          cp -r vendor dist/

      - name: Deploy to Bluehost via FTP/SFTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./dist/
          state-name: .ftp-deploy-sync-state.json
          log-level: verbose
